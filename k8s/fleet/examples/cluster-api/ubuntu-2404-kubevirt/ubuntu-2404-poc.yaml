apiVersion: v1
kind: Namespace
metadata:
  name: ubuntu-2404-poc-2
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ubuntu-2404-poc
  namespace: ubuntu-2404-poc-2
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 10.244.0.0/16
    services:
      cidrBlocks:
      - 10.96.0.0/12
  controlPlaneEndpoint:
    host: 10.253.0.50
    port: 6443
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: ubuntu-2404-poc-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: KubevirtCluster
    name: ubuntu-2404-poc
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtCluster
metadata:
  name: ubuntu-2404-poc
  namespace: ubuntu-2404-poc-2
spec: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-2404-poc-apiserver
  namespace: ubuntu-2404-poc-2
spec:
  loadBalancerIP: 10.253.0.50
  ports:
  - name: kube-apiserver
    port: 6443
    targetPort: 6443
  selector:
    app: ubuntu-2404-poc-cp
  type: LoadBalancer
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtMachineTemplate
metadata:
  name: ubuntu-2404-poc-control-plane
  namespace: ubuntu-2404-poc-2
spec:
  template:
    spec:
      virtualMachineTemplate:
        spec:
          dataVolumeTemplates:
          - metadata:
              name: rootdisk-0
            spec:
              contentType: kubevirt
              pvc:
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 30Gi
                storageClassName: nfs-client
                volumeMode: Filesystem
              source:
                http:
                  url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
          runStrategy: Always
          template:
            metadata:
              labels:
                app: ubuntu-2404-poc-cp
            spec:
              domain:
                cpu:
                  cores: 2
                devices:
                  disks:
                  - disk:
                      bus: virtio
                    name: rootdisk
                  - disk:
                      bus: virtio
                    name: cloudinitdisk
                resources:
                  requests:
                    memory: 4Gi
              volumes:
              - dataVolume:
                  name: rootdisk-0
                name: rootdisk
              - cloudInitNoCloud:
                  userDataBase64: ""
                name: cloudinitdisk
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: ubuntu-2404-poc-control-plane
  namespace: ubuntu-2404-poc-2
spec:
  kubeadmConfigSpec:
    clusterConfiguration:
      controlPlaneEndpoint: 10.253.0.50:6443
      kubernetesVersion: v1.30.0
      networking:
        podSubnet: 10.244.0.0/16
        serviceSubnet: 10.96.0.0/12
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs: {}
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs: {}
    postKubeadmCommands:
    - kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f "https://raw.githubusercontent.com/flannel-io/flannel/v0.25.5/Documentation/kube-flannel.yml"
    preKubeadmCommands:
    - swapoff -a
    - sed -ri '/\sswap\s/s/^#?/#/' /etc/fstab
    - |-
      cat <<EOF | tee /etc/modules-load.d/k8s.conf
      overlay
      br_netfilter
      EOF
    - modprobe overlay
    - modprobe br_netfilter
    - |-
      cat <<EOF | tee /etc/sysctl.d/k8s.conf
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
      EOF
    - sysctl --system
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl gpg
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL "https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key" | gpg --dearmor
      -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/
      /" | tee /etc/apt/sources.list.d/kubernetes.list
    - apt-get update
    - apt-get install -y --no-install-recommends containerd kubelet kubeadm kubectl
    - apt-mark hold kubelet kubeadm kubectl
    - mkdir -p /etc/containerd
    - containerd config default | tee /etc/containerd/config.toml
    - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
    - systemctl enable --now containerd
    - systemctl enable --now kubelet
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: KubevirtMachineTemplate
      name: ubuntu-2404-poc-control-plane
  replicas: 1
  version: v1.30.0
