apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-control-plane
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  goTemplate: true
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  type: control-plane
          - git:
              repoURL: git@github.com:vFondevilla/k8s-homelab.git
              revision: main
              directories:
                - path: k8s/apps/*/overlays/control-plane
                # Move components one at a time while retaining their existing
                # Application identity. Exclusions take precedence over the
                # legacy wildcard, and normalized paths are added explicitly.
                - path: k8s/apps/1password-connect/overlays/control-plane
                  exclude: true
                - path: k8s/apps/platform/1password-connect/overlays/management
                - path: k8s/apps/external-secrets-operator/overlays/control-plane
                  exclude: true
                - path: k8s/apps/platform/external-secrets-operator/overlays/management
                - path: k8s/apps/cert-manager/overlays/control-plane
                  exclude: true
                - path: k8s/apps/platform/cert-manager/overlays/management
                - path: k8s/apps/node-feature-discovery/overlays/control-plane
                  exclude: true
                - path: k8s/apps/platform/node-feature-discovery/overlays/management
                - path: k8s/apps/platform/kubevirt/overlays/management
                - path: k8s/apps/platform/local-provisioner/overlays/management
                - path: k8s/apps/platform/prometheus-crds/overlays/management
  template:
    metadata:
      name: '{{.name}}-{{ if eq (index (splitList "/" .path.path) 2) "platform" }}{{ index (splitList "/" .path.path) 3 }}{{ else }}{{ index (splitList "/" .path.path) 2 }}{{ end }}'
    spec:
      project: default
      destination:
        server: "{{.server}}"
      source:
        repoURL: git@github.com:vFondevilla/k8s-homelab.git
        targetRevision: main
        path: "{{.path.path}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
