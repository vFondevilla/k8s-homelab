apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-control-plane
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  goTemplate: true
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  type: control-plane
          - git:
              repoURL: git@github.com:vFondevilla/k8s-homelab.git
              revision: main
              directories:
                # Keep each path explicit. This prevents a staged overlay from
                # entering the management cluster by directory convention.
                - path: k8s/apps/platform/alloy/overlays/management
                - path: k8s/apps/workloads/hwpo-flex/overlays/management
                - path: k8s/apps/platform/external-dns/overlays/management
                - path: k8s/apps/workloads/home-assistant/overlays/management
                - path: k8s/apps/platform/loki/overlays/management
                - path: k8s/apps/platform/unpoller/overlays/management
                - path: k8s/apps/workloads/meshcentral/overlays/management
                - path: k8s/apps/workloads/mosquitto/overlays/management
                - path: k8s/apps/platform/nfs-subdir/overlays/management
                - path: k8s/apps/workloads/zigbee2mqtt/overlays/management
                - path: k8s/apps/platform/promtail/overlays/management
                - path: k8s/apps/platform/tinkerbell/overlays/management
                - path: k8s/apps/platform/argocd/overlays/management
                - path: k8s/apps/platform/kamaji/overlays/management
                - path: k8s/apps/platform/prometheus/overlays/management
                - path: k8s/apps/platform/cilium/overlays/management
                - path: k8s/apps/platform/cluster-api/overlays/management
                - path: k8s/apps/platform/1password-connect/overlays/management
                - path: k8s/apps/platform/external-secrets-operator/overlays/management
                - path: k8s/apps/platform/cert-manager/overlays/management
                - path: k8s/apps/platform/node-feature-discovery/overlays/management
                - path: k8s/apps/platform/kubevirt/overlays/management
                - path: k8s/apps/platform/local-provisioner/overlays/management
                - path: k8s/apps/platform/prometheus-crds/overlays/management
                - path: k8s/apps/workloads/actualbudget/overlays/management
                - path: k8s/apps/platform/cloudnative-pg/overlays/management
                - path: k8s/apps/platform/democratic-csi/overlays/management
                - path: k8s/apps/platform/reloader/overlays/management
                - path: k8s/apps/workloads/litellm/overlays/management
  template:
    metadata:
      name: '{{.name}}-{{ if or (eq (index (splitList "/" .path.path) 2) "platform") (eq (index (splitList "/" .path.path) 2) "workloads") }}{{ index (splitList "/" .path.path) 3 }}{{ else }}{{ index (splitList "/" .path.path) 2 }}{{ end }}'
    spec:
      project: default
      destination:
        server: "{{.server}}"
      source:
        repoURL: git@github.com:vFondevilla/k8s-homelab.git
        targetRevision: main
        path: "{{.path.path}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
