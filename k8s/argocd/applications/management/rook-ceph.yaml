apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph
  namespace: argocd
spec:
  destination:
    namespace: rook-ceph
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: 'git@github.com:vFondevilla/k8s-homelab.git'
    path: k8s/apps/platform/rook-ceph/overlays/management
    targetRevision: HEAD
  syncPolicy:
    # automated: {}
    syncOptions:
      - CreateNamespace=true
