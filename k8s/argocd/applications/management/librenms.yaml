apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: librenms
  namespace: argocd
spec:
  destination:
    namespace: librenms
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: git@github.com:vFondevilla/k8s-homelab.git
    path: k8s/apps/workloads/librenms/overlays/management
    targetRevision: main
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
