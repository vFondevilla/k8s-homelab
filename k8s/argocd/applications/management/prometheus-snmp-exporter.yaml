apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-snmp-exporter
  namespace: argocd
spec:
  destination:
    namespace: prom
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: 'git@github.com:vFondevilla/k8s-homelab.git'
    path: k8s/apps/platform/prometheus-snmp-exporter/overlays/management
    targetRevision: HEAD
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
