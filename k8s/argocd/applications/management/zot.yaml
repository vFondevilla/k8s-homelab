apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zot
  namespace: argocd
spec:
  destination:
    namespace: zot
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: 'git@github.com:vFondevilla/k8s-homelab.git'
    path: k8s/apps/workloads/zot/overlays/management
    targetRevision: HEAD
  syncPolicy:
    # automated: {}
    syncOptions:
      - CreateNamespace=true
