apiVersion: apps/v1
kind: Deployment
metadata:
  name: hwpo-flex
  labels:
    app.kubernetes.io/name: hwpo-flex
    app.kubernetes.io/component: server
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hwpo-flex
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hwpo-flex
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hwpo-flex
          # Rewritten by the workload overlay to the configured registry/image.
          image: hwpo-flex
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          env:
            - name: HWPO_PROGRESS_DB
              value: /var/lib/hwpo/progress.sqlite3
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: progress
              mountPath: /var/lib/hwpo
            # Keep the root filesystem read-only while providing a writable
            # temporary directory for libraries that use /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: progress
          persistentVolumeClaim:
            claimName: hwpo-flex-progress
        - name: tmp
          emptyDir: {}
