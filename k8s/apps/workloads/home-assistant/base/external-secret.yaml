apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hass-secret
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "hass-secret"
        metadataPolicy: None
        nullBytePolicy: Ignore
        property: password
