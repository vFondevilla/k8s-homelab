apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-agent
  namespace: kubevirt
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: hermes.apps.fondevilla.io
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - hermes.apps.fondevilla.io
      secretName: hermes-agent-tls
  rules:
    - host: hermes.apps.fondevilla.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-agent
                port:
                  name: http
