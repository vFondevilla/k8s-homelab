---
# Requires KubeVirt, CDI, and the nfs-client StorageClass.
# Managed separately from the VM so deleting the VM alone preserves its disk.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: hermes-agent-rootdisk
  namespace: kubevirt
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  source:
    http:
      url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
  storage:
    storageClassName: nfs-client
    accessModes:
      - ReadWriteMany
    volumeMode: Filesystem
    resources:
      requests:
        storage: 50Gi
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: hermes-agent
  namespace: kubevirt
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/vm: hermes-agent
    spec:
      accessCredentials:
        - sshPublicKey:
            source:
              secret:
                secretName: hermes-agent-ssh
            propagationMethod:
              qemuGuestAgent:
                users:
                  - ubuntu
      domain:
        cpu:
          cores: 4
        resources:
          requests:
            memory: 8Gi
        devices:
          disks:
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: podnet
              macAddress: d2:ca:17:e6:8c:21
              masquerade: {}
      networks:
        - name: podnet
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: hermes-agent-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            networkData: |
              version: 2
              ethernets:
                enp1s0:
                  dhcp4: true
                  dhcp6: true
            userData: |
              #cloud-config
              hostname: hermes-agent
              users:
                - name: ubuntu
                  groups: [sudo]
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  shell: /bin/bash
                  lock_passwd: true
              # SSH keys are managed by QEMU guest agent from hermes-agent-ssh.
              ssh_pwauth: false
              disable_root: true
              package_update: true
              packages:
                - qemu-guest-agent
              runcmd:
                - [systemctl, enable, --now, qemu-guest-agent]
              growpart:
                mode: auto
                devices: ['/']
              resize_rootfs: true

---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: kubevirt
  labels:
    kubevirt.io/vm: hermes-agent
  annotations:
    external-dns.alpha.kubernetes.io/hostname: hermes.fondevilla.io
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    kubevirt.io/vm: hermes-agent
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
# Public keys imported from https://github.com/vFondevilla.keys.
# Update this Secret to synchronize keys into the running VM.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-agent-ssh
  namespace: kubevirt
type: Opaque
stringData:
  authorized_keys: |
    ssh-rsa 
    ssh-rsa 
    ssh-rsa 
