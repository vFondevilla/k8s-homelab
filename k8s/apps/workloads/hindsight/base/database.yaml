apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hindsight-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  # The standard CNPG image includes pgvector; the minimal image does not.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:ebf3919504d7523a63e8e2fee9b051211de714644b36469275558c624afd50ec
  bootstrap:
    initdb:
      database: hindsight
      owner: hindsight
      # CNPG generates the hindsight-db-app Secret with application credentials.
      dataChecksums: true
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;
        - CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA public;
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp" WITH SCHEMA public;
  enableSuperuserAccess: false
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
