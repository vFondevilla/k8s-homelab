apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: litellm.apps.fondevilla.io
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - litellm.apps.fondevilla.io
      secretName: litellm-tls
  rules:
    - host: litellm.apps.fondevilla.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  name: http
