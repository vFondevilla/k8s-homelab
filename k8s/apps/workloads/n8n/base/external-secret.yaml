apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-runner-token
  namespace: n8n
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: n8n-runner-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: "n8n Runner Grant Token"
        property: password
