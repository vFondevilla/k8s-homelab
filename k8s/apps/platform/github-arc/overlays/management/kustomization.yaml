apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - discovery.yaml
  - discovery-external-secret.yaml
  - plugin-external-secret.yaml
  - runner-external-secrets.yaml
  - egress-policy.yaml
  - zot-egress-policy.yaml
configMapGenerator:
  - name: arc-personal-discovery-code
    files:
      - server.py
    namespace: arc-discovery
helmCharts:
  - name: gha-runner-scale-set-controller
    repo: oci://ghcr.io/actions/actions-runner-controller-charts
    version: 0.15.1
    releaseName: arc-controller
    namespace: arc-system
    includeCRDs: true
    valuesFile: controller-values.yaml
  - name: gha-runner-scale-set
    repo: oci://ghcr.io/actions/actions-runner-controller-charts
    version: 0.15.1
    releaseName: cloud-viking-io
    namespace: arc-runners-cloud-viking
    valuesFile: org-values.yaml
