apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-discovery-plugin
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: arc-discovery-plugin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: plugin.arc-personal.token
      remoteRef:
        key: ARC Argo plugin
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-discovery-plugin
  namespace: arc-discovery
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: arc-discovery-plugin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: plugin.arc-personal.token
      remoteRef:
        key: ARC Argo plugin
        property: token
