apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-vfondevilla-discovery-app
  namespace: arc-discovery
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: arc-vfondevilla-discovery-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: app_id
      remoteRef:
        key: GitHub ARC vFondevilla
        property: app_id
    - secretKey: installation_id
      remoteRef:
        key: GitHub ARC vFondevilla
        property: installation_id
    - secretKey: private_key
      remoteRef:
        key: GitHub ARC vFondevilla
        property: private_key
