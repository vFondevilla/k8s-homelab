apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - scrapeconfig-external.yaml
  - scrapeconfig-local-llm.yaml
configMapGenerator:
  - name: grafana-dashboard-local-llm
    namespace: prom
    files:
      - dashboards/local-llm-inference.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 68.4.5
    releaseName: kube-prometheus-stack
    namespace: prom
    valuesFile: values.yaml
patches:
  - target:
      kind: PersistentVolumeClaim
      name: kube-prometheus-stack-grafana
    patch: |-
      - op: add
        path: /spec/volumeName
        value: grafana-pv
