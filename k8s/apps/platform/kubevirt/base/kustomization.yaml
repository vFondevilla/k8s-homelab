apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kubevirt-operator.yaml
  - kubevirt-deployment.yaml
  - cdi-operator.yaml
  - cdi-deployment.yaml

patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: cdis.cdi.kubevirt.io
    patch: |-
      - op: remove
        path: /spec/versions/0
