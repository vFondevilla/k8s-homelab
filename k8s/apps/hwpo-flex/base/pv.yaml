apiVersion: v1
kind: PersistentVolume
metadata:
  name: hwpo-flex-progress-pv
  labels:
    app.kubernetes.io/name: hwpo-flex
    app.kubernetes.io/component: storage
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    name: hwpo-flex-progress
    namespace: hwpo-flex
  # The directory must already exist on the NFS server and be writable by
  # UID/GID 10001 (for example, chown 10001:10001 on the TrueNAS dataset).
  nfs:
    server: 10.254.0.3
    path: /mnt/flash/k8s_static_pv/hwpo-flex
  mountOptions:
    - nfsvers=4.1
    - nolock
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hwpo-flex-progress
  labels:
    app.kubernetes.io/name: hwpo-flex
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: hwpo-flex-progress-pv
  resources:
    requests:
      storage: 1Gi

