name: Build hwpo-flex image

# Builds the application image for HWPO Flex and publishes it to the Zot
# registry. The application source lives in a private repository. Its slug and
# read-only token are environment secrets on hwpo-flex-publish and never
# appear in this file or in the public job log. The image tag is always the
# full application commit SHA that the caller supplies. The homelab workflow
# commit SHA is never used as an image tag. This workflow only builds and
# publishes. It never merges or deploys.
#
# Secret scoping: no secret is placed in job-wide env. Each secret reaches only
# the steps that need it. The public checkout action, the build, the push and
# the cleanup processes never receive any raw secret in their environment.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character lowercase commit SHA of the application source to build.
        required: true
        type: string
  repository_dispatch:
    types:
      - build-hwpo-flex-image

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: hwpo-flex-image-${{ github.event.inputs.sha || github.event.client_payload.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish image
    # The branch guard is defense in depth. The hwpo-flex-publish environment
    # deployment branch rule (main only, no tags) and the runner supervisor
    # admission check are what protect the secrets and the runner. Labels
    # alone do not restrict access. See "Runner access enforcement" in the
    # component README.
    if: github.repository == 'vFondevilla/k8s-homelab' && github.ref == 'refs/heads/main'
    environment: hwpo-flex-publish
    # Single unique publisher/ARC label by default. The variable is evaluated
    # when the job is scheduled. There is no generic self-hosted fallback.
    runs-on: ${{ fromJSON(vars.HWPO_FLEX_IMAGE_RUNNER_LABELS || '["hwpo-flex-publisher"]') }}
    env:
      REGISTRY: zot.apps.fondevilla.io
      REGISTRY_BASE_URL: https://zot.apps.fondevilla.io
      REPOSITORY_PATH: hwpo-flex
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sha || github.event.client_payload.sha }}
      IMAGE_REF: zot.apps.fondevilla.io/hwpo-flex:${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sha || github.event.client_payload.sha }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Validate inputs
        env:
          SOURCE_REPOSITORY: ${{ secrets.HWPO_FLEX_SOURCE_REPOSITORY }}
        run: .github/scripts/hwpo-flex-image.sh validate

      - name: Isolate Docker configuration
        run: .github/scripts/hwpo-flex-image.sh docker-init

      - name: Fetch application source
        env:
          SOURCE_REPOSITORY: ${{ secrets.HWPO_FLEX_SOURCE_REPOSITORY }}
          SOURCE_TOKEN: ${{ secrets.HWPO_FLEX_SOURCE_TOKEN }}
        run: .github/scripts/hwpo-flex-image.sh fetch

      - name: Build image
        run: .github/scripts/hwpo-flex-image.sh build

      - name: Registry login
        env:
          REGISTRY_USER: ${{ secrets.HWPO_FLEX_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.HWPO_FLEX_REGISTRY_PASSWORD }}
        run: .github/scripts/hwpo-flex-image.sh login

      # The helper writes missing=true to GITHUB_OUTPUT only after a successful
      # registry request that returned HTTP 404 with a validated OCI error
      # body, and missing=false only after HTTP 200 with a validated OCI or
      # Docker image manifest or image index whose provided
      # Docker-Content-Digest header matches the body bytes. Any other
      # outcome, including an HTTP 200 that is not a valid manifest, such as a
      # proxy sign-in page, fails the step without writing the output, so the
      # push gate below can never be satisfied by an unforeseen failure.
      - name: Check registry tag
        id: tag
        env:
          REGISTRY_USER: ${{ secrets.HWPO_FLEX_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.HWPO_FLEX_REGISTRY_PASSWORD }}
        run: .github/scripts/hwpo-flex-image.sh tag-check

      - name: Push image
        if: steps.tag.outputs.missing == 'true'
        run: .github/scripts/hwpo-flex-image.sh push

      - name: Report result
        run: |
          if [ "${{ steps.tag.outputs.missing }}" = "true" ]; then
            echo "Image pushed to the registry."
          else
            echo "Image tag already present in the registry. No push performed."
          fi

      - name: Clean up
        if: always()
        run: .github/scripts/hwpo-flex-image.sh cleanup
